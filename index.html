<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hrry.Stream - Premium Cloud Media Engine</title>
    
    <!-- Google AdSense Removed & EffectiveCPMNetwork Scripts Added -->
    <script src="https://pl30754964.effectivecpmnetwork.com/ec/0f/df/ec0fdf2da0a0cd57b4b8698126b04bdd.js"></script>
    <script src="https://pl30754966.effectivecpmnetwork.com/a9/3a/36/a93a36175e075dae0b3e911e03810599.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

    <style>
        :root {
            --bg-base: #050505; --glass-bg: rgba(20, 20, 25, 0.7); --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #7C3AED; --primary-gradient: linear-gradient(135deg, #7C3AED 0%, #3B82F6 50%, #06B6D4 100%);
            --text-main: #F8FAFC; --text-muted: #94A3B8;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-base); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        .navbar { background: rgba(5, 5, 5, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border); padding: 16px 5%; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .brand { display: flex; align-items: center; gap: 16px; text-decoration: none; }
        .brand-icon { width: 50px; height: 50px; background: var(--primary-gradient); border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 22px; }
        .brand-text-wrapper { display: flex; flex-direction: column; }
        .brand-title { font-size: 26px; font-weight: 800; color: #fff; }
        .brand-subtitle { font-size: 13px; font-weight: 600; color: #3B82F6; }
        .container { max-width: 1100px; width: 100%; margin: 0 auto; padding: 40px 20px 120px 20px; flex: 1; }
        
        #welcomeSection { text-align: center; display: none; }
        .hero-title { font-size: 48px; font-weight: 900; background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        #playerSection { display: none; width: 100%; }
        .video-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 30px; overflow: hidden; }
        
        /* Updated Media Wrapper to handle all file types dynamically */
        .media-wrapper { width: 100%; background: #000; position: relative; min-height: 250px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .media-wrapper video, .media-wrapper iframe { width: 100%; height: 60vh; border: none; }
        .media-wrapper audio { width: 100%; padding: 20px; }
        .media-wrapper img { max-width: 100%; max-height: 70vh; object-fit: contain; }

        .video-details { padding: 24px; }
        .video-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; color: #fff; }
        .action-buttons { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; margin-top: 20px; }
        
        .btn { border: none; padding: 12px 16px; border-radius: 14px; font-size: 14px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
        .btn-primary { background: var(--primary-gradient); color: #fff; }
        .btn-secondary { background: rgba(255, 255, 255, 0.05); color: #fff; border: 1px solid var(--glass-border); }

        .toast { position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(15, 15, 20, 0.95); border: 1px solid rgba(124, 58, 237, 0.5); padding: 16px 32px; border-radius: 100px; color: #fff; font-size: 15px; z-index: 1001; opacity: 0; pointer-events: none; transition: 0.4s; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        
        .glass-overlay-ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(15px); display: flex; justify-content: center; align-items: center; z-index: 3000; opacity: 0; pointer-events: none; transition: 0.4s; }
        .glass-overlay-ui.active { opacity: 1; pointer-events: all; }
        .glass-box-ui { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 35px; padding: 40px; text-align: center; transform: scale(0.9); transition: 0.4s; }
        .glass-overlay-ui.active .glass-box-ui { transform: scale(1); }
        
        .circular-timer { position: relative; width: 120px; height: 120px; margin: 0 auto 20px auto; }
        .circular-timer svg { transform: rotate(-90deg); width: 100%; height: 100%; }
        .circular-timer circle { fill: none; stroke-width: 6; stroke-linecap: round; }
        .circular-timer .bg { stroke: rgba(255,255,255,0.1); }
        .circular-timer .progress { stroke: var(--primary); stroke-dasharray: 283; stroke-dashoffset: 0; transition: stroke-dashoffset 1s linear; }
        .time-left { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 36px; font-weight: 800; color: #fff; }

        @media (max-width: 768px) { .action-buttons { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="/" class="brand">
            <div class="brand-icon"><i class="fas fa-play"></i></div>
            <div class="brand-text-wrapper">
                <span class="brand-title">Hrry.Stream</span>
                <span class="brand-subtitle">hrry.online | @himanshurajyadav</span>
            </div>
        </a>
    </header>

    <div class="container">
        <section id="welcomeSection">
            <h1 class="hero-title">Cloud Media Engine Pro</h1>
            <p>Send any Video, Audio, Photo, or PDF to our Telegram Bot to generate a direct stream link.</p>
            <br>
            <a href="https://t.me/PoltPulse_File_Id_bot" target="_blank" class="btn btn-primary" style="padding: 15px 30px; font-size: 18px;">
                <i class="fab fa-telegram-plane"></i> Launch Telegram Bot Now
            </a>
        </section>

        <!-- Dynamic Player Section -->
        <section id="playerSection">
            <div class="video-card">
                <!-- Media Wrapper where the player, image, or PDF will render -->
                <div class="media-wrapper" id="mediaContainer">
                    <!-- Javascript will inject correct element here based on MIME type -->
                </div>
                
                <div class="video-details">
                    <h2 class="video-title" id="displayTitle">Hrry.Stream Secure Media</h2>
                    <div class="action-buttons">
                        <a id="dlBtn" href="#" class="btn btn-primary">
                            <i class="fas fa-cloud-download-alt"></i> Download File
                        </a>
                        <button class="btn btn-secondary" onclick="copyLink()">
                            <i class="fas fa-copy"></i> Copy Link
                        </button>
                        <button class="btn btn-secondary" onclick="shareVideo()">
                            <i class="fas fa-share-nodes"></i> Share
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <div class="toast" id="toast">
        <i class="fas fa-bell"></i> <span id="toastMsg">Notification</span>
    </div>

    <!-- Download Overlay System -->
    <div id="downloadOverlay" class="glass-overlay-ui" style="display: none;">
        <div class="glass-box-ui">
            <h3 style="color: #fff; margin-bottom: 25px;">Generating Link...</h3>
            <div class="circular-timer">
                <svg viewBox="0 0 100 100">
                    <circle class="bg" cx="50" cy="50" r="45"></circle>
                    <circle class="progress" id="timerProgress" cx="50" cy="50" r="45"></circle>
                </svg>
                <div class="time-left" id="timerText">15</div>
            </div>
            <a id="finalDownloadBtn" href="#" class="btn btn-primary" style="display: none; width: 100%;" download>
                <i class="fas fa-download"></i> Get File Now
            </a>
        </div>
    </div>

    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        let finalDownloadUrl = '';
        const smartLinkUrl = "https://www.effectivecpmnetwork.com/w82na4w6sw?key=ac9c026166ef35c5fbf295ca0c7b9baa";

        function triggerSmartLinkAd() { window.open(smartLinkUrl, '_blank'); }

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const mediaUrl = urlParams.get('url');
            const mediaTitle = urlParams.get('title') || 'Hrry.Stream Cloud Media';
            // Getting MIME type passed from Telegram bot, default to video
            const mimeType = urlParams.get('mime') || 'video/mp4'; 

            if (mediaUrl && mediaUrl.trim() !== '') {
                document.getElementById('welcomeSection').style.display = 'none';
                document.getElementById('playerSection').style.display = 'block';
                document.getElementById('displayTitle').innerText = decodeURIComponent(mediaTitle);
                
                finalDownloadUrl = mediaUrl; 
                const mediaContainer = document.getElementById('mediaContainer');

                // Dynamic Rendering based on File Type
                if (mimeType.startsWith('video/')) {
                    mediaContainer.innerHTML = `
                        <video id="player" controls playsinline autoplay>
                            <source src="${mediaUrl}" type="${mimeType}">
                        </video>`;
                    const player = new Plyr('#player', { autoplay: true, muted: true });
                } 
                else if (mimeType.startsWith('audio/')) {
                    mediaContainer.innerHTML = `
                        <audio id="player" controls>
                            <source src="${mediaUrl}" type="${mimeType}">
                        </audio>`;
                    const player = new Plyr('#player');
                } 
                else if (mimeType.startsWith('image/')) {
                    mediaContainer.innerHTML = `<img src="${mediaUrl}" alt="${mediaTitle}">`;
                } 
                else if (mimeType === 'application/pdf') {
                    mediaContainer.innerHTML = `<iframe src="${mediaUrl}"></iframe>`;
                } 
                else {
                    // Fallback for other files (APK, ZIP, etc)
                    mediaContainer.innerHTML = `
                        <div style="text-align: center; padding: 40px;">
                            <i class="fas fa-file-alt" style="font-size: 80px; color: var(--primary); margin-bottom: 20px;"></i>
                            <h3 style="color: #fff;">File Ready</h3>
                            <p style="color: var(--text-muted); margin-top: 10px;">Format: ${mimeType}<br>This format cannot be previewed. Please download.</p>
                        </div>`;
                }
            } else {
                document.getElementById('welcomeSection').style.display = 'block';
            }
        });

        // Download Timer Logic
        const dlBtn = document.getElementById('dlBtn');
        const downloadOverlay = document.getElementById('downloadOverlay');
        const timerProgress = document.getElementById('timerProgress');
        const timerText = document.getElementById('timerText');
        const finalDownloadBtn = document.getElementById('finalDownloadBtn');

        dlBtn.addEventListener('click', (e) => {
            e.preventDefault();
            if (!finalDownloadUrl) return showToast("Link Not Found!");
            triggerSmartLinkAd();
            
            downloadOverlay.style.display = 'flex';
            setTimeout(() => downloadOverlay.classList.add('active'), 10);
            
            let timeLeft = 15;
            timerText.innerText = timeLeft;
            finalDownloadBtn.style.display = 'none';
            
            const countdown = setInterval(() => {
                timeLeft--;
                timerText.innerText = timeLeft;
                timerProgress.style.strokeDashoffset = 283 - (timeLeft / 15) * 283;

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    finalDownloadBtn.href = finalDownloadUrl;
                    finalDownloadBtn.style.display = 'inline-flex';
                }
            }, 1000);
        });

        finalDownloadBtn.addEventListener('click', () => {
            downloadOverlay.classList.remove('active');
            setTimeout(() => downloadOverlay.style.display = 'none', 400);
            showToast("Download Started...");
        });

        function copyLink() {
            triggerSmartLinkAd();
            navigator.clipboard.writeText(window.location.href);
            showToast("Secure Link Copied!");
        }
        function shareVideo() {
            triggerSmartLinkAd();
            if (navigator.share) { navigator.share({ title: document.title, url: window.location.href }); } 
            else { copyLink(); }
        }
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3500);
        }
    </script>
</body>
</html>
